<script>
// Letras de la marca. PRIMERA visita: esperan a que la app termine de abrir (no le quitan internet a lo
// importante) y mientras tanto se ve la letra del aparato. Desde la segunda ya están guardadas y salen de una vez.
(function(d){var h=d.documentElement,ya=false;try{ya=localStorage.getItem('aramo_letras')==='1';}catch(e){}
  if(ya){['jakarta-latin','fraunces-latin'].forEach(function(f){var l=d.createElement('link');l.rel='preload';l.as='font';l.type='font/woff2';l.crossOrigin='anonymous';l.href='fuentes/'+f+'.woff2';d.head.appendChild(l);});return;}
  h.classList.add('espera-letras');
  // al terminar de abrir: se piden las letras y, cuando ya están guardadas, se anota para la próxima vez
  addEventListener('load',function(){setTimeout(function(){h.classList.remove('espera-letras');
    var ok=function(){try{localStorage.setItem('aramo_letras','1');}catch(e){}};
    try{d.fonts.load('600 16px "Plus Jakarta Sans"').then(ok,function(){});}catch(e){ok();}},60);});
})(document);
</script>
