<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARAMO Taller de pedidos</title>
<meta name="description" content="Decí qué necesitás: ARAMO arma tu canasta de frutas y verduras, la pesa, te avisa y la recogés lista o te llega a casa.">
<meta name="theme-color" content="#06120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARAMO Taller">
<link rel="manifest" href="./canasta.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" href="./icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="canasta.css?v=20261005-paso6-3">
<script>try{var t=localStorage.getItem('cn_theme');if(t)document.documentElement.dataset.theme=t;if(/[?&]mini=1/.test(location.search)){document.documentElement.classList.add('mini');var m=location.search.match(/[?&]tema=(light|dark)/);if(m)document.documentElement.dataset.theme=m[1];}}catch(e){}</script>
<script src="canasta-config.js"></script>
<script src="aramo-nube.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script defer src="canasta.js?v=20261005-paso6-3"></script>
</head>
<body>
<div class="tl" id="tl">
  <header class="tl-top">
    <div class="brand">
      <h1>ARAMO <span>Taller</span></h1>
      <p>Decí qué necesitás. Lo escogemos uno por uno, lo pesamos, te avisamos y lo recogés listo o te llega a casa.</p>
      <a class="tl-back" href="APP.html" aria-label="Volver al menú principal">⌂ Volver al menú principal</a>
    </div>
    <div class="tl-tools">
      <button class="ib" id="tlBitBtn" type="button" aria-label="Bitácora de mis pedidos">🧾<span class="n" id="tlBitN" hidden></span></button>
      <button class="ib" id="tlTema" type="button" aria-label="Cambiar tema">☀️</button>
    </div>
    <div class="chips" id="tlChips"></div>
  </header>
  <div class="grid">
    <section class="panel spine" id="tlSpine" aria-label="Ciclo del pedido"></section>
    <section class="panel mesa" id="tlMesa" aria-live="polite"></section>
  </div>
  <section class="panel" id="tlBit" aria-label="Bitácora"></section>
</div>
<div class="bar hide" id="tlBar"><div class="bar-in" id="tlBarIn"></div></div>
<div class="sheet-bg" id="tlSheetBg"></div>
<div class="sheet" id="tlSheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="tlToast" role="status" aria-live="polite"></div>
<noscript>ARAMO Taller necesita JavaScript activado.</noscript>
</body>
</html>
