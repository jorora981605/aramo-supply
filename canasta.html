<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARAMO Canasta</title>
<meta name="description" content="Armá tu canasta de frutas y verduras en ARAMO y recogela lista.">
<meta name="theme-color" content="#f6f3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARAMO Canasta">
<link rel="manifest" href="./canasta.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" href="./icon.png">
<link rel="stylesheet" href="canasta.css">
<script>try{var t=localStorage.getItem('cn_theme');if(t)document.documentElement.dataset.theme=t;if(/[?&]mini=1/.test(location.search)){document.documentElement.classList.add('mini');var m=location.search.match(/[?&]tema=(light|dark)/);if(m)document.documentElement.dataset.theme=m[1];}}catch(e){}</script>
<script src="canasta-config.js"></script>
<script src="aramo-nube.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script defer src="canasta.js"></script>
</head>
<body>
<div class="cn" id="cn">
  <header class="cn-top">
    <div class="cn-logo"><i>🧺</i><div><small>ARAMO</small>Canasta</div></div>
    <div class="cn-top-r">
      <button class="icon-btn" id="cnMis" type="button" aria-label="Mis pedidos">🧾<span class="dot" id="cnMisDot" hidden></span></button>
      <button class="icon-btn" id="cnTema" type="button" aria-label="Cambiar tema">🌙</button>
    </div>
  </header>
  <nav class="ciclo" id="cnCiclo" aria-label="Pasos del pedido"></nav>
  <main class="main" id="cnMain"></main>
</div>
<div class="bar hide" id="cnBar"><div class="bar-in" id="cnBarIn"></div></div>
<div class="sheet-bg" id="cnSheetBg"></div>
<div class="sheet" id="cnSheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="cnToast" role="status" aria-live="polite"></div>
<noscript>ARAMO Canasta necesita JavaScript activado.</noscript>
</body>
</html>
