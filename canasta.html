<script>
// Letras de la marca. Se piden junto con la página (las 4: la del ₡ también) y la pantalla espera a tenerlas
// (hasta 0,7 s si ya estaban guardadas; hasta 2 s la primera vez). Así nada cambia de forma ni de lugar
// después de pintar: antes se veía la letra del aparato y 1 a 3 segundos después todo "se acomodaba".
(function(d){var h=d.documentElement,ya=false;try{ya=localStorage.getItem('aramo_letras')==='1';}catch(e){}
  ['jakarta-latin','jakarta-latin-ext','fraunces-latin','fraunces-latin-ext'].forEach(function(f){var l=d.createElement('link');l.rel='preload';l.as='font';l.type='font/woff2';l.crossOrigin='anonymous';l.href='fuentes/'+f+'.woff2';d.head.appendChild(l);});
  h.classList.add('espera-letras');
  var fin=function(){if(!h.classList.contains('espera-letras'))return;h.classList.remove('espera-letras');};
  setTimeout(fin,ya?700:2000);
  d.addEventListener('DOMContentLoaded',function(){
    var ok=function(){try{localStorage.setItem('aramo_letras','1');}catch(e){}fin();};
    try{Promise.all([d.fonts.load('600 16px "Plus Jakarta Sans"','₡ñ'),d.fonts.load('700 16px "Fraunces"','₡ñ')]).then(ok,fin);}catch(e){fin();}
  });
})(document);
</script>
<style>html.espera-letras body{opacity:0}</style>
